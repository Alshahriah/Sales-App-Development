<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sale</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }
        .form-container {
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn-custom {
            border-radius: 30px;
        }
        .card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .heading-link {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            color: #007bff;
            text-decoration: none;
        }
        .heading-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h2>Create Sale</h2>
                <form method="post" action="/create_sale">
                    <div class="form-group">
                        <label for="product_name">Product Name</label>
                        <input type="text" class="form-control" id="product_name" name="product_name" required>
                    </div>
                    <div class="form-group">
                        <label for="product_description">Product Description</label>
                        <textarea class="form-control" id="product_description" name="product_description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="supplier_name">Supplier Name</label>
                        <input type="text" class="form-control" id="supplier_name" name="supplier_name" required>
                    </div>
                    <div class="form-group">
                        <label for="sale_price">Sale Price</label>
                        <input type="text" class="form-control" id="sale_price" name="sale_price" required>
                    </div>
                    <div class="form-group">
                        <label for="amazon_commission">Amazon Commission (%)</label>
                        <input type="text" class="form-control" id="amazon_commission" name="amazon_commission" required>
                    </div>
                    <div class="form-group">
                        <label for="forexFees">Forex Fees (%)</label>
                        <select class="form-control" id="forexFees" name="forex_fees">
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" required>
                    </div>
                    <div class="form-group">
                        <label for="buy_price">Buy Price</label>
                        <input type="text" class="form-control" id="buy_price" name="buy_price" required>
                    </div>
                    <div class="form-group">
                        <label for="estimated_delivery">Estimated Delivery</label>
                        <input type="date" class="form-control" id="estimated_delivery" name="estimated_delivery" required>
                    </div>
                    <div class="form-group">
                        <label for="sale_date">Sale Date</label>
                        <input type="date" class="form-control" id="sale_date" name="sale_date" required>
                    </div>
                    <div class="form-group">
                        <label for="buyer_name">Buyer Name</label>
                        <input type="text" class="form-control" id="buyer_name" name="buyer_name" required>
                    </div>
                    <div class="form-group">
                        <label for="buyer_address">Buyer Address</label>
                        <textarea class="form-control" id="buyer_address" name="buyer_address"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="delivery_status">Delivery Status</label>
                        <select class="form-control" id="delivery_status" name="delivery_status">
                            <option value="Received">Received</option>
                            <option value="Shipped">Shipped</option>
                            <option value="Delivered">Delivered</option>
                            <option value="Cancelled">Cancelled</option>
                            <option value="Returned">Returned</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="manage_link">Manage Link</label>
                        <input type="text" class="form-control" id="manage_link" name="manage_link">
                    </div>
                    <div class="form-group">
                        <label for="payment_link">Payment Link</label>
                        <input type="text" class="form-control" id="payment_link" name="payment_link">
                    </div>
                    <div class="form-group">
                        <label for="amazonLink">Amazon Link</label>
                        <input type="url" class="form-control" id="amazonLink" name="amazon_link" placeholder="Amazon order link">
                    </div>
                    <div class="form-group">
                        <label for="region_id">Region</label>
                        <select class="form-control" id="region_id" name="region_id">
                            {% for region in regions %}
                            <option value="{{ region.id }}">{{ region.region_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-custom">Create Sale</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        // Function to set the sale_date to today's date in India
        function setSaleDateToToday() {
            const saleDateInput = document.getElementById('sale_date');
            const today = new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
            const localDate = new Date(today);
            const formattedDate = localDate.toISOString().split('T')[0];
            saleDateInput.value = formattedDate;
        }

        // Set the sale_date when the page loads
        window.onload = setSaleDateToToday;
    </script>
</body>
</html>
