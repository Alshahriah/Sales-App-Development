<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sale</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/create_sale.css"> <!-- External CSS -->
</head>
<body class="bg-gray-900 font-roboto">
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white py-4 px-6 w-full flex justify-between items-center">
        <h1 class="text-2xl font-bold"><a href="/" class="text-white">ISM</a></h1>
        <div class="space-x-4">
            <a href="/" class="hover:bg-blue-800 py-2 px-4 rounded">Dashboard</a>
            <a href="/logs" class="hover:bg-blue-800 py-2 px-4 rounded">Logs</a>
            <a href="/admin" class="hover:bg-blue-800 py-2 px-4 rounded">Admin</a>
            <a href="/admin/countries" class="hover:bg-blue-800 py-2 px-4 rounded">Countries</a>
            <a href="/admin/view_orders" class="hover:bg-blue-800 py-2 px-4 rounded">View Orders</a>
            <a href="/create_sale" class="hover:bg-blue-800 py-2 px-4 rounded">Create Sale +</a>
        </div>
    </nav>

    <div class="container mx-auto px-4 flex-1 flex flex-col items-center justify-center mt-10">
        <div class="card bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
            <h2 class="text-3xl font-bold tracking-wide text-center text-black mb-4">Create Sale</h2>
            <form method="post" action="/create_sale">
                <div class="form-group mb-4">
                    <label for="product_name" class="block font-bold mb-2" style="color: #000000;">Product Name</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="product_name" name="product_name" required>
                </div>
                <div class="form-group mb-4">
                    <label for="product_description" class="block font-bold mb-2" style="color: #000000;">Product Description</label>
                    <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="product_description" name="product_description"></textarea>
                </div>
                <div class="form-group mb-4">
                    <label for="supplier_name" class="block font-bold mb-2" style="color: #000000;">Supplier Name</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="supplier_name" name="supplier_name" required>
                </div>
                <div class="form-group mb-4">
                    <label for="sale_price" class="block font-bold mb-2" style="color: #000000;">Sale Price</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="sale_price" name="sale_price" required>
                </div>
                <div class="form-group mb-4">
                    <label for="amazon_commission" class="block font-bold mb-2" style="color: #000000;">Amazon Commission (%)</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="amazon_commission" name="amazon_commission" required>
                </div>
                <div class="form-group mb-4">
                    <label for="forexFees" class="block font-bold mb-2" style="color: #000000;">Forex Fees (%)</label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="forexFees" name="forex_fees">
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <div class="form-group mb-4">
                    <label for="quantity" class="block font-bold mb-2" style="color: #000000;">Quantity</label>
                    <input type="number" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="quantity" name="quantity" required>
                </div>
                <div class="form-group mb-4">
                    <label for="buy_price" class="block font-bold mb-2" style="color: #000000;">Buy Price</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="buy_price" name="buy_price" required>
                </div>
                <div class="form-group mb-4">
                    <label for="estimated_delivery" class="block font-bold mb-2" style="color: #000000;">Estimated Delivery</label>
                    <input type="date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="estimated_delivery" name="estimated_delivery" required>
                </div>
                <div class="form-group mb-4">
                    <label for="sale_date" class="block font-bold mb-2" style="color: #000000;">Sale Date</label>
                    <input type="date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="sale_date" name="sale_date" required>
                </div>
                <div class="form-group mb-4">
                    <label for="buyer_name" class="block font-bold mb-2" style="color: #000000;">Buyer Name</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="buyer_name" name="buyer_name" required>
                </div>
                <div class="form-group mb-4">
                    <label for="buyer_address" class="block font-bold mb-2" style="color: #000000;">Buyer Address</label>
                    <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="buyer_address" name="buyer_address"></textarea>
                </div>
                <div class="form-group mb-4">
                    <label for="delivery_status" class="block font-bold mb-2" style="color: #000000;">Delivery Status</label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="delivery_status" name="delivery_status">
                        <option value="Received">Received</option>
                        <option value="Shipped">Shipped</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="Returned">Returned</option>
                    </select>
                </div>
                <div class="form-group mb-4">
                    <label for="manage_link" class="block font-bold mb-2" style="color: #000000;">Manage Link</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="manage_link" name="manage_link">
                </div>
                <div class="form-group mb-4">
                    <label for="payment_link" class="block font-bold mb-2" style="color: #000000;">Payment Link</label>
                    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="payment_link" name="payment_link">
                </div>
                <div class="form-group mb-4">
                    <label for="amazonLink" class="block font-bold mb-2" style="color: #000000;">Amazon Link</label>
                    <input type="url" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="amazonLink" name="amazon_link" placeholder="Amazon order link">
                </div>
                <div class="form-group mb-4">
                    <label for="region_id" class="block font-bold mb-2" style="color: #000000;">Region</label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="region_id" name="region_id">
                        {% for region in regions %}
                        <option value="{{ region.id }}">{{ region.region_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded-full btn-custom">Create Sale</button>
            </form>
        </div>
    </div>
    <script src="/static/js/create_sale.js"></script>
</body>
</html>
