<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Times</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/countries.css">
    <link rel="stylesheet" href="/static/css/time.css">
</head>
<body class="bg-gray-900 font-roboto">
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white py-4 px-6 w-full flex justify-between items-center">
        <h1 class="text-2xl font-bold"><a href="/" class="text-white">ISM</a></h1>
        <div class="space-x-4">
            <a href="/" class="hover:bg-blue-800 py-2 px-4 rounded">Dashboard</a>
            <a href="/logs" class="hover:bg-blue-800 py-2 px-4 rounded">Logs</a>
            <a href="/admin" class="hover:bg-blue-800 py-2 px-4 rounded">Admin</a>
            <a href="/admin/countries" class="hover:bg-blue-800 py-2 px-4 rounded">Countries</a>
            <a href="/admin/view_orders" class="hover:bg-blue-800 py-2 px-4 rounded">View Orders</a>
            <a href="/create_sale" class="hover:bg-blue-800 py-2 px-4 rounded">Create Sale +</a>
        </div>
    </nav>

    <div class="time-container">
        <div class="card bg-gray-800 text-white p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-6">Marketplace Times</h2>
            <div id="times" class="grid-container">
                <!-- Time cards will be populated here by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        const marketplaces = [
            // Priority marketplaces (USA and Canada)
            { name: 'USA (ET)', timezone: 'America/New_York', city: 'New York', priority: true },
            { name: 'USA (CT)', timezone: 'America/Chicago', city: 'Chicago', priority: true },
            { name: 'USA (MT)', timezone: 'America/Denver', city: 'Denver', priority: true },
            { name: 'USA (PT)', timezone: 'America/Los_Angeles', city: 'Los Angeles', priority: true },
            { name: 'Canada (ET)', timezone: 'America/Toronto', city: 'Toronto', priority: true },
            { name: 'Canada (PT)', timezone: 'America/Vancouver', city: 'Vancouver', priority: true },
            // Other marketplaces
            { name: 'UK', timezone: 'Europe/London', city: 'London' },
            { name: 'Germany', timezone: 'Europe/Berlin', city: 'Berlin' },
            { name: 'Japan', timezone: 'Asia/Tokyo', city: 'Tokyo' },
            { name: 'Australia', timezone: 'Australia/Sydney', city: 'Sydney' },
            { name: 'India', timezone: 'Asia/Kolkata', city: 'Kolkata' },
            { name: 'UAE', timezone: 'Asia/Dubai', city: 'Dubai' }
        ];

        function createClock(marketplace) {
            const clockDiv = document.createElement('div');
            clockDiv.className = `clock ${marketplace.priority ? 'priority' : ''}`;
            
            // Add clock markers
            for (let i = 1; i <= 12; i++) {
                const marker = document.createElement('div');
                marker.className = 'clock-marker';
                marker.style.transform = `rotate(${i * 30}deg) translateY(-80px)`;
                clockDiv.appendChild(marker);
            }

            clockDiv.innerHTML += `
                <div class="hand hour-hand"></div>
                <div class="hand minute-hand"></div>
                <div class="hand second-hand"></div>
                <div class="clock-center"></div>
            `;
            return clockDiv;
        }

        function updateClocks() {
            const clocks = document.querySelectorAll('.clock');
            clocks.forEach((clock, index) => {
                const timezone = marketplaces[index].timezone;
                const now = new Date(new Date().toLocaleString('en-US', { timeZone: timezone }));
                
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();

                const hourDeg = (hours % 12 + minutes / 60) * 30;
                const minuteDeg = minutes * 6;
                const secondDeg = seconds * 6;

                const hourHand = clock.querySelector('.hour-hand');
                const minuteHand = clock.querySelector('.minute-hand');
                const secondHand = clock.querySelector('.second-hand');

                hourHand.style.transform = `rotate(${hourDeg}deg)`;
                minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
                secondHand.style.transform = `rotate(${secondDeg}deg)`;
            });
        }

        function updateTimes() {
            const timesContainer = document.getElementById('times');
            if (timesContainer.children.length === 0) {
                // Sort marketplaces to show priority ones first
                const sortedMarketplaces = [...marketplaces].sort((a, b) => 
                    (b.priority || false) - (a.priority || false)
                );

                sortedMarketplaces.forEach(marketplace => {
                    const card = document.createElement('div');
                    card.className = `timezone-card ${marketplace.priority ? 'ring-2 ring-blue-500' : ''}`;
                    
                    const clock = createClock(marketplace);
                    
                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'time-info';
                    
                    card.appendChild(clock);
                    card.appendChild(timeDisplay);
                    timesContainer.appendChild(card);
                });
            }

            // Update time displays
            document.querySelectorAll('.timezone-card').forEach((card, index) => {
                const marketplace = marketplaces[index];
                const timeDisplay = card.querySelector('div:last-child');
                timeDisplay.className = 'time-info';
                
                const time = new Date().toLocaleTimeString('en-US', {
                    timeZone: marketplace.timezone,
                    hour12: true,
                    hour: 'numeric',
                    minute: 'numeric',
                    second: 'numeric'
                });

                const date = new Date().toLocaleDateString('en-US', {
                    timeZone: marketplace.timezone,
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                timeDisplay.innerHTML = `
                    <h3 class="marketplace-name">${marketplace.name}</h3>
                    <p class="city-name">${marketplace.city}</p>
                    <p class="time-display">${time}</p>
                    <p class="date-display">${date}</p>
                `;
            });

            updateClocks();
        }

        updateTimes();
        setInterval(updateTimes, 1000);
    </script>
</body>
</html>
