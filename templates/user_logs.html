<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <!-- Make the "User Logs" header clickable to redirect to "/" -->
        <h1 class="text-3xl font-bold mb-4 cursor-pointer" onclick="window.location.href='/'">User Logs</h1>
        <table class="table-auto w-full text-left">
            <thead>
                <tr>
                    <th class="px-4 py-2">Username</th>
                    <th class="px-4 py-2">IP Address</th>
                    <th class="px-4 py-2">User Agent</th>
                    <th class="px-4 py-2">Login Time (UTC)</th>
                    <th class="px-4 py-2">Login Time (IST)</th>
                </tr>
            </thead>
            <tbody>
                {% for log in user_logs %}
                <tr>
                    <td class="border px-4 py-2">{{ log.username }}</td>
                    <td class="border px-4 py-2">{{ log.ip_address }}</td>
                    <td class="border px-4 py-2">{{ log.user_agent }}</td>
                    <td class="border px-4 py-2">{{ log.login_time }}</td>
                    <td class="border px-4 py-2">{{ log.india_time }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
