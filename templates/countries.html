<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regions</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/countries.css"> <!-- External CSS -->
</head>
<body class="bg-gray-900 font-roboto">
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white py-4 px-6 w-full flex justify-between items-center">
        <h1 class="text-2xl font-bold"><a href="/" class="text-white">ISM</a></h1>
        <div class="space-x-4">
            <a href="/" class="hover:bg-blue-800 py-2 px-4 rounded">Dashboard</a>
            <a href="/logs" class="hover:bg-blue-800 py-2 px-4 rounded">Logs</a>
            <a href="/admin" class="hover:bg-blue-800 py-2 px-4 rounded">Admin</a>
            <a href="/admin/countries" class="hover:bg-blue-800 py-2 px-4 rounded">Countries</a>
            <a href="/admin/view_orders" class="hover:bg-blue-800 py-2 px-4 rounded">View Orders</a>
            <a href="/create_sale" class="hover:bg-blue-800 py-2 px-4 rounded">Create Sale +</a>
        </div>
    </nav>

    <div class="container mx-auto px-4 flex-1 flex flex-col items-center justify-center">
        <div class="card bg-white p-6 rounded-lg shadow-lg mt-20 w-full max-w-2xl"> <!-- Adjusted width and top margin to accommodate fixed navbar -->
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-white font-bold text-2xl">Regions</h2>
                <a href="/admin/addregion" class="bg-green-500 text-white py-2 px-4 rounded-full">Add Region</a>
            </div>
            <div class="table-container mt-6 max-w-full mx-auto">
                <table class="table-auto w-full border-collapse border">
                    <thead>
                        <tr>
                            <th class="border py-2 px-4">Region Name</th>
                            <th class="border py-2 px-4">Region Code</th>
                            <th class="border py-2 px-4">Orders Count</th>
                            <th class="border py-2 px-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for region in regions %}
                        <tr>
                            <td class="border px-4 py-2">{{ region.region_name }}</td>
                            <td class="border px-4 py-2">{{ region.region_code }}</td>
                            <td class="border px-4 py-2">{{ region.orders_count }}</td>
                            <td class="border px-4 py-2">
                                <a href="/admin/orders_by_region/{{ region.region_id }}" class="bg-blue-500 text-white py-1 px-3 rounded">View Orders</a>
                            </td>                            
                        </tr>
                        {% endfor %}
                    </tbody>
                    <tfoot>
                        <tr class="bg-yellow-500">
                            <td colspan="2" class="border py-2 px-4 font-bold text-gray-900">Total Orders</td>
                            <td colspan="2" class="border py-2 px-4 font-bold text-gray-900">{{ total_orders }}</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
